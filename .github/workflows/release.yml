name: '[🚀] Release'

# Publishing a GitHub release (with a tag such as v1.2.0) builds the desktop
# and Android apps and attaches the install files to that release.
# Run it manually with an existing tag to rebuild the files of a release.
on:
  # TEMPORARY: verify the packaging jobs on this branch (no release is touched)
  push:
    branches: [claude/exciting-hypatia-iyjaaz]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing release to build and attach files to (e.g. v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  desktop:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            script: electron:build:linux
            files: |
              dist-packaged/*.AppImage
              dist-packaged/*.deb
          - name: Windows
            os: windows-latest
            script: electron:build:win
            files: |
              dist-packaged/*.exe
              dist-packaged/*.zip
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set app version from tag
        if: env.TAG != ''
        run: npm pkg set version="${TAG#v}"

      - name: Build and package
        run: pnpm run ${{ matrix.script }} --publish never
        env:
          # No code-signing certificate is configured
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List packaged files
        run: ls -la dist-packaged

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
          retention-days: 7

      - name: Attach files to release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true

  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute version
        id: version
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION:-$(node -p "require('./package.json').version")}"
          # Android needs an increasing integer: 1.2.3 -> 10203
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          if [ "$CODE" -lt 1 ]; then CODE=1; fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build web app and sync Android project
        run: pnpm build:android

      - name: Build APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Rename APK
        run: |
          mkdir -p dist-packaged
          mv android/app/build/outputs/apk/debug/app-debug.apk \
            "dist-packaged/BookLib-${{ steps.version.outputs.name }}-android.apk"
          ls -la dist-packaged

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android
          path: dist-packaged/*.apk
          retention-days: 7

      - name: Attach files to release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist-packaged/*.apk
          fail_on_unmatched_files: true

  release-notes:
    name: Add download links
    needs: [desktop, android]
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Add downloads section to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          MARKER='<!-- booklib-downloads -->'

          gh release view "$TAG" --repo "$REPO" --json body --jq .body > notes.md
          if grep -q "$MARKER" notes.md; then
            echo "Release notes already have a downloads section"
            exit 0
          fi

          {
            echo "$MARKER"
            echo "## ⬇️ Download BookLib"
            echo
            echo "| Platform | File | How to install |"
            echo "| --- | --- | --- |"
            echo "| Windows | [BookLib-Setup-$VERSION-x64.exe]($BASE/BookLib-Setup-$VERSION-x64.exe) | Run the installer. Windows may show a SmartScreen warning because the app is not signed: choose **More info → Run anyway**. |"
            echo "| Windows (portable) | [BookLib-$VERSION-win-x64.zip]($BASE/BookLib-$VERSION-win-x64.zip) | Unzip and run \`BookLib.exe\`. |"
            echo "| Linux | [BookLib-$VERSION-x86_64.AppImage]($BASE/BookLib-$VERSION-x86_64.AppImage) | Make it executable (\`chmod +x\`) and run it. |"
            echo "| Linux (Debian/Ubuntu) | [booklib_${VERSION}_amd64.deb]($BASE/booklib_${VERSION}_amd64.deb) | \`sudo apt install ./booklib_${VERSION}_amd64.deb\` |"
            echo "| Android | [BookLib-$VERSION-android.apk]($BASE/BookLib-$VERSION-android.apk) | Open the file on your phone and allow installing apps from your browser or file manager when asked. |"
            echo
            if [ -s notes.md ]; then
              echo
              cat notes.md
            fi
          } > new-notes.md

          gh release edit "$TAG" --repo "$REPO" --notes-file new-notes.md
