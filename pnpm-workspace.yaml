packages:
  - .

# pnpm 10 skips dependency install scripts unless they are listed here.
# `electron` needs its postinstall to download the Electron binary.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
  # Their install scripts only print a message (via epubjs): not needed
  core-js: false
  es5-ext: false

# Was `public-hoist-pattern[]=*` in .npmrc, which pnpm no longer reads:
# some packages are imported without being direct dependencies
# (e.g. @formkit/vue, dotenv)
publicHoistPattern:
  - '*'

# Was the "pnpm" field in package.json, which pnpm no longer reads
overrides:
  '@vercel/nft': ^0.27.4
  '@electron/node-gyp': 10.2.0-electron.1
