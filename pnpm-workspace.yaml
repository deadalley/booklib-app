packages:
  - .

# pnpm 10 skips dependency install scripts unless they are listed here.
# `electron` needs its postinstall to download the Electron binary.
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true
